services:
  quorum:
    build:
      context: .
      dockerfile: Dockerfile
    image: quorum-analyzer:latest
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
