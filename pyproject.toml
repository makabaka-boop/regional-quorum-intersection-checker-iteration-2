[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-analyzer"
version = "0.1.0"
description = "Read/write storage quorum feasibility and intersection analyzer"
requires-python = ">=3.11"

[project.scripts]
quorum-analyzer = "quorum.cli:main"

[tool.setuptools]
packages = ["quorum"]
